[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator (randomized DFS) with a BFS solver."
readme = "mazegen/README.md"
requires-python = ">=3.10"
dependencies = []
license-files = ["LICENSE.md"]
license = "MIT"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mazegen"]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "rich>=15.0.0",
]